document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

{{ col.milestoneLabel }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hysaHasOffChart }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12px; color:#8A7A6B; margin-top:10px;\">🎯 Projected completion beyond this view: <strong style=\"font-family:'Space Mono',monospace; color:#E2703A;\">{{ hysaOffChartLabel }}<\u002Fstrong><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== HISTORY TAB ===================== -->\n    <sc-if value=\"{{ isHistory }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"History &amp; Archives\">\n        <sc-if value=\"{{ hasHistory }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px;\">\n            <sc-for list=\"{{ history }}\" as=\"h\" hint-placeholder-count=\"2\">\n              <div style=\"background:#FFFFFF; border:1px solid #F0E4D6; border-radius:16px; padding:20px; opacity:.85;\">\n                <div style=\"font-family:'Lora',serif; font-size:16px; font-weight:600; margin-bottom:10px;\">{{ h.key }}<\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between; font-size:13.5px; color:#8A7A6B; padding:5px 0; border-bottom:1px solid #F5EEE4;\"><span>Income<\u002Fspan><span style=\"font-family:'Space Mono',monospace;\">{{ h.fmtIncome }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between; font-size:13.5px; color:#8A7A6B; padding:5px 0; border-bottom:1px solid #F5EEE4;\"><span>True discretionary<\u002Fspan><span style=\"font-family:'Space Mono',monospace;\">{{ h.fmtDiscretionary }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between; font-size:13.5px; color:#8A7A6B; padding:5px 0; border-bottom:1px solid #F5EEE4;\"><span>Left for free spending<\u002Fspan><span style=\"color:{{ h.leftColor }}; font-family:'Space Mono',monospace;\">{{ h.fmtLeft }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between; font-size:13.5px; color:#8A7A6B; padding:5px 0;\"><span>Buckets funded<\u002Fspan><span style=\"font-family:'Space Mono',monospace;\">{{ h.bucketsFunded }} / {{ h.bucketsCount }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasNoHistory }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align:center; padding:60px 20px; color:#8A7A6B; font-size:14.5px;\">No archived months yet — use \"Simulate Next Month\" to build history.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1280}, &quot;layoutDensity&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;spacious&quot;, &quot;options&quot;: [&quot;spacious&quot;, &quot;compact&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Layout&quot;}, &quot;showCents&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Layout&quot;}, &quot;confettiIntensity&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;full&quot;, &quot;options&quot;: [&quot;subtle&quot;, &quot;full&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Celebrations&quot;}}\">\nclass Component extends DCLogic {\n  cashFlowChartRef = React.createRef();\n  discretionaryChartRef = React.createRef();\n\n  state = {\n    activeTab: 'dashboard',\n    hoverTip: null,\n    completedIds: [],\n    pacer: { weekAnchor: null, weekStartPool: null },\n    history: [\n      { key: 'April 2026', income: 7020.00, trueDiscretionary: 845.10, leftForFreeSpending: 120.40, bucketsCount: 3, bucketsFunded: 0 },\n      { key: 'May 2026', income: 7149.46, trueDiscretionary: 960.25, leftForFreeSpending: -45.00, bucketsCount: 3, bucketsFunded: 0 },\n    ],\n    template: {\n      fixedExpenses: [\n        { id: 'fx1', name: 'Rent', amount: 2773.00 },\n        { id: 'fx2', name: 'Water / sewer / trash', amount: 73.55 },\n        { id: 'fx3', name: 'Internet', amount: 45.33 },\n        { id: 'fx4', name: 'Renters insurance', amount: 7.26 },\n        { id: 'fx5', name: 'Electricity/Gas', amount: 89.73 },\n      ],\n      essentials: [\n        { id: 'es1', name: 'Groceries + supplies', amount: 355.00 },\n        { id: 'es2', name: 'Gas', amount: 52.00 },\n        { id: 'es3', name: 'Public Transit + Parking', amount: 8.00 },\n        { id: 'es4', name: 'Restaurants', amount: 200.00 },\n      ],\n      subscriptions: [\n        { id: 'sb1', name: 'Climbing Gym', amount: 121.00 },\n        { id: 'sb2', name: 'Claude', amount: 22.10 },\n        { id: 'sb3', name: 'YouTube Music', amount: 20.98 },\n        { id: 'sb4', name: 'Walmart+', amount: 12.95 },\n        { id: 'sb5', name: 'Forfeit', amount: 10.99 },\n        { id: 'sb6', name: 'iCloud', amount: 9.99 },\n        { id: 'sb7', name: 'Amazon Prime', amount: 7.49 },\n        { id: 'sb8', name: 'Bunpro', amount: 5.00 },\n        { id: 'sb9', name: '750 Words', amount: 5.00 },\n        { id: 'sb10', name: 'Audible', amount: 6.95 },\n      ],\n      savings: [\n        { id: 'sv1', name: 'Emergency fund (replenish)', amount: 2000.00, paused: false },\n        { id: 'sv2', name: 'HYSA', amount: 0, paused: true },\n        { id: 'sv3', name: 'Roth IRA', amount: 511.36, paused: false },\n      ],\n    },\n    month: {\n      key: 'June 2026',\n      tagline: 'Emergency fund rebuild · HYSA paused',\n      pending: false,\n      income: 7149.46,\n      rolloverIn: -45.00,\n      fixedExpenses: [\n        { id: 'fx1', name: 'Rent', amount: 2773.00 },\n        { id: 'fx2', name: 'Water / sewer / trash', amount: 73.55 },\n        { id: 'fx3', name: 'Internet', amount: 45.33 },\n        { id: 'fx4', name: 'Renters insurance', amount: 7.26 },\n        { id: 'fx5', name: 'Electricity/Gas', amount: 89.73 },\n      ],\n      essentials: [\n        { id: 'es1', name: 'Groceries + supplies', amount: 355.00 },\n        { id: 'es2', name: 'Gas', amount: 52.00 },\n        { id: 'es3', name: 'Public Transit + Parking', amount: 8.00 },\n        { id: 'es4', name: 'Restaurants', amount: 200.00 },\n      ],\n      subscriptions: [\n        { id: 'sb1', name: 'Climbing Gym', amount: 121.00 },\n        { id: 'sb2', name: 'Claude', amount: 22.10 },\n        { id: 'sb3', name: 'YouTube Music', amount: 20.98 },\n        { id: 'sb4', name: 'Walmart+', amount: 12.95 },\n        { id: 'sb5', name: 'Forfeit', amount: 10.99 },\n        { id: 'sb6', name: 'iCloud', amount: 9.99 },\n        { id: 'sb7', name: 'Amazon Prime', amount: 7.49 },\n        { id: 'sb8', name: 'Bunpro', amount: 5.00 },\n        { id: 'sb9', name: '750 Words', amount: 5.00 },\n        { id: 'sb10', name: 'Audible', amount: 6.95 },\n      ],\n      savings: [\n        { id: 'sv1', name: 'Emergency fund (replenish)', amount: 2000.00, paused: false },\n        { id: 'sv2', name: 'HYSA', amount: 0, paused: true },\n        { id: 'sv3', name: 'Roth IRA', amount: 511.36, paused: false },\n      ],\n      quickLog: [\n        { id: 'ql1', amount: 14.50, description: 'Coffee run', ts: Date.now() - 86400000 * 3 },\n        { id: 'ql2', amount: 38.20, description: 'Target — misc', ts: Date.now() - 86400000 },\n      ],\n      manualSpent: 0,\n      bucketTopUps: 0,\n      buckets: [\n        { id: 'bk1', name: 'New Climbing Shoes', target: 180, funded: 140, monthlyAlloc: 40 },\n        { id: 'bk2', name: 'Japan Trip Fund', target: 3000, funded: 450, monthlyAlloc: 150 },\n        { id: 'bk3', name: 'New Bike', target: 600, funded: 560, monthlyAlloc: 40 },\n      ],\n      emergencyFund: { target: 12000, balance: 7200 },\n      hysa: { target: 5000, balance: 3000 },\n    },\n  };\n\n  genId() {\n    this._idc = (this._idc || 0) + 1;\n    return 'id' + this._idc + Date.now().toString(36);\n  }\n\n  fmt(n) {\n    const showCents = this.props.showCents !== false;\n    const sign = n < 0 ? '-' : '';\n    const v = Math.abs(n);\n    return sign + '$' + v.toLocaleString('en-US', { minimumFractionDigits: showCents ? 2 : 0, maximumFractionDigits: showCents ? 2 : 0 });\n  }\n\n  showTip(e) { this.setState({ hoverTip: e.currentTarget.dataset.tip }); }\n  hideTip() { this.setState({ hoverTip: null }); }\n\n  commitOnEnter(e) {\n    if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }\n  }\n\n  calcTotals(m) {\n    const sum = arr => arr.reduce((a, x) => a + (x.amount || 0), 0);\n    const fixedTotal = sum(m.fixedExpenses);\n    const essentialsTotal = sum(m.essentials);\n    const subsTotal = sum(m.subscriptions);\n    const savingsTotal = sum(m.savings);\n    const ccSpent = essentialsTotal + subsTotal;\n    const bucketAllocTotal = m.buckets.reduce((a, b) => a + (b.monthlyAlloc || 0), 0);\n    const rolloverIn = m.rolloverIn || 0;\n    const manualSpent = (m.quickLog || []).reduce((a, x) => a + (x.amount || 0), 0);\n    const bucketTopUps = m.bucketTopUps || 0;\n    const trueDiscretionary = m.income - fixedTotal - savingsTotal - essentialsTotal - subsTotal + rolloverIn;\n    const ccPoolTotal = trueDiscretionary + ccSpent;\n    const leftForFreeSpending = trueDiscretionary - bucketAllocTotal - manualSpent - bucketTopUps;\n    return { fixedTotal, essentialsTotal, subsTotal, savingsTotal, ccSpent, ccPoolTotal, bucketAllocTotal, rolloverIn, manualSpent, bucketTopUps, trueDiscretionary, leftForFreeSpending };\n  }\n\n  getFieldKey(group) {\n    return { fixed: 'fixedExpenses', essentials: 'essentials', subscriptions: 'subscriptions', savings: 'savings' }[group];\n  }\n\n  goTab(e) { this.setState({ activeTab: e.currentTarget.dataset.tab }); }\n\n  handleIncomeChange(e) {\n    const val = parseFloat(e.target.value) || 0;\n    this.setState(s => ({ month: { ...s.month, income: val } }));\n  }\n\n  handleSpentChange(e) {\n    const val = parseFloat(e.target.value) || 0;\n    this.setState(s => ({ month: { ...s.month, manualSpent: val } }));\n  }\n\n  handleFieldChange(e) {\n    const { id, group, field } = e.currentTarget.dataset;\n    const key = this.getFieldKey(group);\n    let val = e.target.value;\n    if (field !== 'name') val = parseFloat(val) || 0;\n    this.setState(s => ({ month: { ...s.month, [key]: s.month[key].map(x => x.id === id ? { ...x, [field]: val } : x) } }));\n  }\n\n  removeItem(e) {\n    const { id, group } = e.currentTarget.dataset;\n    const key = this.getFieldKey(group);\n    this.setState(s => ({ month: { ...s.month, [key]: s.month[key].filter(x => x.id !== id) } }));\n  }\n\n  addItem(e) {\n    const group = e.currentTarget.dataset.group;\n    const key = this.getFieldKey(group);\n    const item = { id: this.genId(), name: 'New item', amount: 0 };\n    if (group === 'savings') item.paused = false;\n    this.setState(s => ({ month: { ...s.month, [key]: [...s.month[key], item] } }));\n  }\n\n  togglePaused(e) {\n    const id = e.currentTarget.dataset.id;\n    this.setState(s => ({ month: { ...s.month, savings: s.month.savings.map(x => x.id === id ? { ...x, paused: !x.paused } : x) } }));\n  }\n\n  addBucket() {\n    const item = { id: this.genId(), name: 'New Bucket', target: 500, funded: 0, monthlyAlloc: 0 };\n    this.setState(s => ({ month: { ...s.month, buckets: [...s.month.buckets, item] } }));\n  }\n\n  updateBucketName(e) {\n    const id = e.currentTarget.dataset.id;\n    const val = e.target.value;\n    this.setState(s => ({ month: { ...s.month, buckets: s.month.buckets.map(b => b.id === id ? { ...b, name: val } : b) } }));\n  }\n\n  updateBucketAlloc(e) {\n    const id = e.currentTarget.dataset.id;\n    const val = parseFloat(e.target.value) || 0;\n    this.setState(s => ({ month: { ...s.month, buckets: s.month.buckets.map(b => b.id === id ? { ...b, monthlyAlloc: val } : b) } }));\n  }\n\n  updateBucketTarget(e) {\n    const id = e.currentTarget.dataset.id;\n    const newTarget = parseFloat(e.target.value) || 0;\n    this.setState(s => {\n      let releaseAmt = 0;\n      const buckets = s.month.buckets.map(b => {\n        if (b.id !== id) return b;\n        let funded = b.funded;\n        if (funded > newTarget) { releaseAmt = funded - newTarget; funded = newTarget; }\n        return { ...b, target: newTarget, funded };\n      });\n      return { month: { ...s.month, buckets, bucketTopUps: s.month.bucketTopUps - releaseAmt } };\n    });\n  }\n\n  deleteBucket(e) {\n    const id = e.currentTarget.dataset.id;\n    this.setState(s => {\n      const b = s.month.buckets.find(x => x.id === id);\n      const release = b ? b.funded : 0;\n      return { month: { ...s.month, buckets: s.month.buckets.filter(x => x.id !== id), bucketTopUps: s.month.bucketTopUps - release } };\n    });\n  }\n\n  addFunds(e) {\n    const id = e.currentTarget.dataset.id;\n    const row = e.currentTarget.closest('[data-bucket-row]');\n    const input = row ? row.querySelector('input[data-fund-input]') : null;\n    const amt = input ? (parseFloat(input.value) || 0) : 0;\n    if (amt <= 0) return;\n    this.setState(s => ({\n      month: {\n        ...s.month,\n        buckets: s.month.buckets.map(b => b.id === id ? { ...b, funded: Math.min(b.target, b.funded + amt) } : b),\n        bucketTopUps: s.month.bucketTopUps + amt,\n      },\n    }));\n    if (input) input.value = '';\n  }\n\n  logExpense() {\n    const amtInput = this._quickLogAmountRef;\n    const descInput = this._quickLogDescRef;\n    const amt = amtInput ? (parseFloat(amtInput.value) || 0) : 0;\n    if (amt <= 0) return;\n    const description = descInput && descInput.value.trim() ? descInput.value.trim() : 'Spontaneous spend';\n    const item = { id: this.genId(), amount: amt, description, ts: Date.now() };\n    this.setState(s => ({ month: { ...s.month, quickLog: [...(s.month.quickLog || []), item] } }));\n    if (amtInput) amtInput.value = '';\n    if (descInput) descInput.value = '';\n  }\n\n  deleteQuickLogItem(e) {\n    const id = e.currentTarget.dataset.id;\n    this.setState(s => ({ month: { ...s.month, quickLog: (s.month.quickLog || []).filter(x => x.id !== id) } }));\n  }\n\n  updateFundField(e) {\n    const { fund, field } = e.currentTarget.dataset;\n    const val = parseFloat(e.target.value) || 0;\n    this.setState(s => ({ month: { ...s.month, [fund]: { ...s.month[fund], [field]: val } } }));\n  }\n\n  getContribution(m, keyword) {\n    const item = m.savings.find(x => x.name.toLowerCase().includes(keyword));\n    return item ? { amount: item.amount || 0, paused: !!item.paused } : { amount: 0, paused: false };\n  }\n\n  parseMonthKey(key) {\n    const parts = key.split(' ');\n    return new Date(parts[0] + ' 1, ' + parts[1]);\n  }\n\n  nextMonthLabel(key) {\n    const parts = key.split(' ');\n    const d = new Date(parts[0] + ' 1, ' + parts[1]);\n    d.setMonth(d.getMonth() + 1);\n    return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });\n  }\n\n  deepCopyTemplate(arr) {\n    return arr.map(x => ({ ...x, id: this.genId() }));\n  }\n\n  simulateNextMonth() {\n    if (!window.confirm('Simulate the next month? This archives ' + this.state.month.key + ' and starts a new pending month.')) return;\n    const totals = this.calcTotals(this.state.month);\n    const archiveEntry = {\n      key: this.state.month.key,\n      income: this.state.month.income,\n      trueDiscretionary: totals.trueDiscretionary,\n      leftForFreeSpending: totals.leftForFreeSpending,\n      bucketsCount: this.state.month.buckets.length,\n      bucketsFunded: this.state.month.buckets.filter(b => b.funded >= b.target).length,\n    };\n    const rolloverIn = totals.leftForFreeSpending;\n    const nextKey = this.nextMonthLabel(this.state.month.key);\n    const t = this.state.template;\n    const newMonth = {\n      key: nextKey,\n      tagline: this.state.month.tagline,\n      pending: true,\n      income: this.state.month.income,\n      rolloverIn: rolloverIn,\n      fixedExpenses: this.deepCopyTemplate(t.fixedExpenses),\n      essentials: this.deepCopyTemplate(t.essentials),\n      subscriptions: this.deepCopyTemplate(t.subscriptions),\n      savings: this.deepCopyTemplate(t.savings),\n      manualSpent: 0,\n      quickLog: [],\n      bucketTopUps: 0,\n      buckets: this.state.month.buckets.filter(b => b.funded < b.target),\n      emergencyFund: { ...this.state.month.emergencyFund },\n      hysa: { ...this.state.month.hysa },\n    };\n    this.setState(s => ({ history: [...s.history, archiveEntry], month: newMonth, completedIds: [], activeTab: 'dashboard' }));\n  }\n\n  confirmStartMonth() {\n    this.setState(s => ({ month: { ...s.month, pending: false } }));\n  }\n\n  getCompleteIds() {\n    const m = this.state.month;\n    const ids = [];\n    m.buckets.forEach(b => { if (b.target > 0 && b.funded >= b.target) ids.push('b_' + b.id); });\n    if (m.emergencyFund.target > 0 && m.emergencyFund.balance >= m.emergencyFund.target) ids.push('ef');\n    if (m.hysa.target > 0 && m.hysa.balance >= m.hysa.target) ids.push('hysa');\n    return ids;\n  }\n\n  checkWeekReset() {\n    const now = new Date();\n    const day = (now.getDay() + 6) % 7;\n    const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day);\n    const key = monday.toDateString();\n    if (this.state.pacer.weekAnchor !== key) {\n      const totals = this.calcTotals(this.state.month);\n      const poolBeforeSpending = totals.trueDiscretionary - totals.bucketAllocTotal;\n      this.setState({\n        pacer: {\n          weekAnchor: key,\n          weekStartManualSpent: totals.manualSpent,\n          weekStartBucketTopUps: totals.bucketTopUps,\n          weekStartPoolBeforeSpending: poolBeforeSpending,\n        },\n      });\n    }\n  }\n\n  getPacerView() {\n    const now = new Date();\n    const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();\n    const daysRemaining = Math.max(1, daysInMonth - now.getDate() + 1);\n    const weeksRemaining = daysRemaining / 7;\n    const totals = this.calcTotals(this.state.month);\n\n    // Budget structure (income, fixed, savings, essentials, subscriptions, bucket allocations)\n    // feeds live into the weekly starting allowance. Only actual spending during the week\n    // (manual spend + one-time bucket top-ups) draws down against it.\n    const poolBeforeSpending = totals.trueDiscretionary - totals.bucketAllocTotal;\n    const weeklyAllowance = Math.max(0, poolBeforeSpending / weeksRemaining);\n\n    const pacer = this.state.pacer || {};\n    const weekStartManualSpent = pacer.weekStartManualSpent != null ? pacer.weekStartManualSpent : totals.manualSpent;\n    const weekStartBucketTopUps = pacer.weekStartBucketTopUps != null ? pacer.weekStartBucketTopUps : totals.bucketTopUps;\n    const weekStartPoolBeforeSpending = pacer.weekStartPoolBeforeSpending != null ? pacer.weekStartPoolBeforeSpending : poolBeforeSpending;\n\n    const spentThisWeek = Math.max(0, (totals.manualSpent - weekStartManualSpent) + (totals.bucketTopUps - weekStartBucketTopUps));\n    const pct = weeklyAllowance > 0 ? Math.min(100, (spentThisWeek / weeklyAllowance) * 100) : (spentThisWeek > 0 ? 100 : 0);\n    const overBudget = spentThisWeek > weeklyAllowance + 0.005;\n    const structureChanged = Math.abs(poolBeforeSpending - weekStartPoolBeforeSpending) > 0.5;\n\n    const inDeficit = totals.leftForFreeSpending < -0.005;\n    let message = null, messageType = null;\n    if (inDeficit) {\n      message = 'Budget Deficit: Reduce spending. You are ' + this.fmt(totals.leftForFreeSpending) + ' in the red.';\n      messageType = 'warning';\n    } else if (overBudget) {\n      message = 'You exceeded this week\\'s budget by ' + this.fmt(spentThisWeek - weeklyAllowance) + '.';\n      messageType = 'warning';\n    } else if (structureChanged) {\n      message = 'Your weekly starting allowance updated to ' + this.fmt(weeklyAllowance) + '/week based on your latest budget changes.';\n      messageType = 'info';\n    }\n    return {\n      weeklyAllowance,\n      spentThisWeek,\n      remaining: Math.max(0, weeklyAllowance - spentThisWeek),\n      pct,\n      overBudget,\n      message,\n      messageType,\n      weeksRemaining,\n    };\n  }\n\n  componentDidUpdate() {\n    this.checkWeekReset();\n    const completeNow = this.getCompleteIds();\n    const newOnes = completeNow.filter(id => !this.state.completedIds.includes(id));\n    if (newOnes.length) {\n      this.setState({ completedIds: [...this.state.completedIds, ...newOnes] });\n      const intensity = this.props.confettiIntensity === 'subtle' ? 60 : 150;\n      newOnes.forEach((id, i) => {\n        setTimeout(() => {\n          if (window.confetti) window.confetti({ particleCount: intensity, spread: 80, origin: { y: 0.6 } });\n        }, i * 1500);\n      });\n    }\n    this.syncCharts();\n  }\n\n  componentDidMount() {\n    this.checkWeekReset();\n    this.syncCharts();\n  }\n\n  syncCharts() {\n    if (!window.Chart) return;\n    const c1 = this.cashFlowChartRef.current;\n    if (c1 && this._cashFlowChartData) {\n      if (this._cashFlowChart && this._cashFlowChart.canvas !== c1) { this._cashFlowChart.destroy(); this._cashFlowChart = null; }\n      if (!this._cashFlowChart) {\n        this._cashFlowChart = new Chart(c1, {\n          type: 'doughnut',\n          data: { labels: this._cashFlowChartData.labels, datasets: [{ data: this._cashFlowChartData.values, backgroundColor: this._cashFlowChartData.colors, borderColor: '#FFFFFF', borderWidth: 2 }] },\n          options: { plugins: { legend: { display: false }, tooltip: { enabled: true } }, cutout: '62%', animation: { duration: 400 } },\n        });\n      } else {\n        this._cashFlowChart.data.labels = this._cashFlowChartData.labels;\n        this._cashFlowChart.data.datasets[0].data = this._cashFlowChartData.values;\n        this._cashFlowChart.data.datasets[0].backgroundColor = this._cashFlowChartData.colors;\n        this._cashFlowChart.update();\n      }\n    }\n    const c2 = this.discretionaryChartRef.current;\n    if (c2 && this._discChartData) {\n      if (this._discChart && this._discChart.canvas !== c2) { this._discChart.destroy(); this._discChart = null; }\n      if (!this._discChart) {\n        this._discChart = new Chart(c2, {\n          type: 'doughnut',\n          data: { labels: this._discChartData.labels, datasets: [{ data: this._discChartData.values, backgroundColor: this._discChartData.colors, borderColor: '#FFFFFF', borderWidth: 2 }] },\n          options: { plugins: { legend: { display: false }, tooltip: { enabled: true } }, cutout: '62%', animation: { duration: 400 } },\n        });\n      } else {\n        this._discChart.data.labels = this._discChartData.labels;\n        this._discChart.data.datasets[0].data = this._discChartData.values;\n        this._discChart.data.datasets[0].backgroundColor = this._discChartData.colors;\n        this._discChart.update();\n      }\n    }\n  }\n\n  buildFundColumns(m, fund, keyword, achievedColor, cremeColor) {\n    const anchor = this.parseMonthKey(m.key);\n    const contrib = this.getContribution(m, keyword);\n    const contribution = contrib.amount;\n    const paused = contrib.paused;\n    const effectiveContribution = paused ? 0 : contribution;\n    const target = fund.target || 0;\n    const balance = fund.balance || 0;\n    const progressPct = target > 0 ? Math.min(100, (balance / target) * 100) : 0;\n    const remaining = Math.max(0, target - balance);\n    const monthsToGo = effectiveContribution > 0 ? Math.max(0, Math.ceil(remaining / effectiveContribution)) : null;\n    const year = anchor.getFullYear();\n    const anchorMonthIdx = anchor.getMonth();\n    const completionDate = monthsToGo != null ? new Date(anchor.getFullYear(), anchor.getMonth() + monthsToGo, 1) : null;\n    const completionInYear = completionDate && completionDate.getFullYear() === year;\n    const offChartLabel = (completionDate && !completionInYear) ? completionDate.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) : '';\n    const columns = [];\n    for (let i = 0; i < 12; i++) {\n      const d = new Date(year, i, 1);\n      const label = d.toLocaleDateString('en-US', { month: 'short' });\n      const isMilestone = completionInYear && i === completionDate.getMonth();\n      const achieved = completionInYear && i >= anchorMonthIdx && i <= completionDate.getMonth();\n      columns.push({\n        label,\n        color: achieved ? achievedColor : cremeColor,\n        isMilestone,\n        labelColor: isMilestone ? achievedColor : (i < anchorMonthIdx ? '#C9B79E' : '#8A7A6B'),\n        labelWeight: isMilestone ? 700 : 400,\n        milestoneLabel: isMilestone ? (monthsToGo === 0 ? 'Complete!' : d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' })) : '',\n      });\n    }\n    return { contribution: effectiveContribution, progressPct, columns, paused, offChartLabel };\n  }\n\n  renderVals() {\n    const m = this.state.month;\n    const totals = this.calcTotals(m);\n    const showCents = this.props.showCents !== false;\n\n    const tabBase = active => ({\n      border: 'none',\n      background: 'transparent',\n      fontFamily: \"'Plus Jakarta Sans',sans-serif\",\n      fontSize: '14.5px',\n      fontWeight: 600,\n      padding: '10px 16px',\n      cursor: 'pointer',\n      color: active ? '#E2703A' : '#8A7A6B',\n      borderBottom: active ? '2px solid #E2703A' : '2px solid transparent',\n      marginBottom: '-1px',\n    });\n    const styleToStr = obj => Object.entries(obj).map(([k, v]) => k.replace(/[A-Z]/g, c => '-' + c.toLowerCase()) + ':' + v).join(';');\n\n    const savingsWithBadge = m.savings.map(x => ({\n      ...x,\n      pausedLabel: x.paused ? 'paused' : 'active',\n      pausedBg: x.paused ? '#F5EDE3' : '#E7F3EA',\n      pausedColor: x.paused ? '#8A7A6B' : '#4F8F63',\n    }));\n\n    const bucketsView = m.buckets.map(b => {\n      const pct = b.target > 0 ? Math.min(100, (b.funded / b.target) * 100) : 0;\n      const complete = b.target > 0 && b.funded >= b.target;\n      return {\n        ...b,\n        pct,\n        fmtFunded: this.fmt(b.funded),\n        barColor: complete ? '#4F8F63' : '#E2703A',\n        statusLabel: complete ? 'Complete' : Math.round(pct) + '% funded',\n        statusColor: complete ? '#4F8F63' : '#8A7A6B',\n      };\n    });\n\n    const quickLogFeed = [...(m.quickLog || [])].sort((a, b) => b.ts - a.ts).map(x => ({\n      ...x,\n      fmtAmount: this.fmt(x.amount),\n      fmtDate: new Date(x.ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),\n    }));\n\n    const pacer = this.getPacerView();\n    const efFund = this.buildFundColumns(m, m.emergencyFund, 'emergency', '#4F8F63', '#F5EDE3');\n    const hysaFund = this.buildFundColumns(m, m.hysa, 'hysa', '#E2703A', '#F5EDE3');\n\n    const cashFlowRows = [\n      { label: 'Fixed Expenses', value: totals.fixedTotal, color: '#6B5B4E' },\n      { label: 'Savings & Investments', value: totals.savingsTotal, color: '#4F8F63' },\n      { label: 'Essentials', value: totals.essentialsTotal, color: '#C1543A' },\n      { label: 'Subscriptions', value: totals.subsTotal, color: '#D9A066' },\n      { label: 'True Discretionary', value: Math.max(0, totals.trueDiscretionary), color: '#E2703A' },\n    ];\n    this._cashFlowChartData = {\n      labels: cashFlowRows.map(r => r.label),\n      values: cashFlowRows.map(r => r.value),\n      colors: cashFlowRows.map(r => r.color),\n    };\n    const cashFlowLegend = cashFlowRows.map(r => ({ ...r, fmtValue: this.fmt(r.value) }));\n\n    const discPalette = ['#E2703A', '#4F8F63', '#D9A066', '#C1543A', '#6B5B4E', '#B79E86', '#8A9B6E', '#D98E73'];\n    const discRows = m.buckets.map((b, i) => ({ label: b.name, value: b.monthlyAlloc || 0, color: discPalette[i % discPalette.length] }));\n    const unallocated = Math.max(0, totals.leftForFreeSpending);\n    if (unallocated > 0) discRows.push({ label: 'Unallocated (free spending)', value: unallocated, color: '#F0E4D6' });\n    this._discChartData = {\n      labels: discRows.map(r => r.label),\n      values: discRows.map(r => r.value),\n      colors: discRows.map(r => r.color),\n    };\n    const discretionaryLegend = discRows.map(r => ({ ...r, fmtValue: this.fmt(r.value) }));\n\n    const historyView = this.state.history.map(h => ({\n      ...h,\n      fmtIncome: this.fmt(h.income),\n      fmtDiscretionary: this.fmt(h.trueDiscretionary),\n      fmtLeft: this.fmt(h.leftForFreeSpending),\n      leftColor: h.leftForFreeSpending < 0 ? '#C1543A' : '#4F8F63',\n    }));\n\n    return {\n      month: { ...m, savings: savingsWithBadge, buckets: bucketsView },\n      history: historyView,\n      hasHistory: historyView.length > 0,\n      hasNoHistory: historyView.length === 0,\n      isDashboard: this.state.activeTab === 'dashboard',\n      isBuckets: this.state.activeTab === 'buckets',\n      isTimeline: this.state.activeTab === 'timeline',\n      isHistory: this.state.activeTab === 'history',\n      tabStyle_dashboard: styleToStr(tabBase(this.state.activeTab === 'dashboard')),\n      tabStyle_buckets: styleToStr(tabBase(this.state.activeTab === 'buckets')),\n      tabStyle_timeline: styleToStr(tabBase(this.state.activeTab === 'timeline')),\n      tabStyle_history: styleToStr(tabBase(this.state.activeTab === 'history')),\n      goTab: this.goTab.bind(this),\n      simulateNextMonth: this.simulateNextMonth.bind(this),\n      confirmStartMonth: this.confirmStartMonth.bind(this),\n      handleIncomeChange: this.handleIncomeChange.bind(this),\n      handleSpentChange: this.handleSpentChange.bind(this),\n      handleFieldChange: this.handleFieldChange.bind(this),\n      removeItem: this.removeItem.bind(this),\n      addItem: this.addItem.bind(this),\n      togglePaused: this.togglePaused.bind(this),\n      addBucket: this.addBucket.bind(this),\n      updateBucketName: this.updateBucketName.bind(this),\n      updateBucketAlloc: this.updateBucketAlloc.bind(this),\n      updateBucketTarget: this.updateBucketTarget.bind(this),\n      deleteBucket: this.deleteBucket.bind(this),\n      addFunds: this.addFunds.bind(this),\n      updateFundField: this.updateFundField.bind(this),\n      logExpense: this.logExpense.bind(this),\n      deleteQuickLogItem: this.deleteQuickLogItem.bind(this),\n      setQuickLogAmountRef: el => { this._quickLogAmountRef = el; },\n      setQuickLogDescRef: el => { this._quickLogDescRef = el; },\n      quickLogFeed,\n      hasQuickLog: quickLogFeed.length > 0,\n      hasNoQuickLog: quickLogFeed.length === 0,\n      fmtQuickLogTotal: this.fmt(totals.manualSpent),\n      commitOnEnter: this.commitOnEnter.bind(this),\n      fmtTrueDiscretionary: this.fmt(totals.trueDiscretionary),\n      fmtLeftForFreeSpending: this.fmt(totals.leftForFreeSpending),\n      freeSpendingColor: totals.leftForFreeSpending < 0 ? '#C1543A' : '#3A2E26',\n      fmtFixedTotal: this.fmt(totals.fixedTotal),\n      fmtSavingsTotal: this.fmt(totals.savingsTotal),\n      fmtEssentialsTotal: this.fmt(totals.essentialsTotal),\n      fmtSubsTotal: this.fmt(totals.subsTotal),\n      fmtCcSpent: this.fmt(totals.ccSpent),\n      fmtCcLeft: this.fmt(totals.trueDiscretionary),\n      fmtCcTotal: this.fmt(totals.ccPoolTotal),\n      ccLeftColor: totals.trueDiscretionary < 0 ? '#C1543A' : '#3A2E26',\n      ccBarPct: totals.ccPoolTotal > 0 ? Math.min(100, (totals.ccSpent / totals.ccPoolTotal) * 100) : 0,\n      fmtBucketAlloc: this.fmt(totals.bucketAllocTotal),\n      fmtBucketTopUps: this.fmt(m.bucketTopUps || 0),\n      showTip: this.showTip.bind(this),\n      hideTip: this.hideTip.bind(this),\n      showTipIncome: this.state.hoverTip === 'income',\n      showTipDiscretionary: this.state.hoverTip === 'discretionary',\n      showTipFree: this.state.hoverTip === 'free',\n      tipIncomeText: 'Entered manually — your total monthly take-home pay across all paychecks.',\n      tipDiscretionaryText: 'Net Income − Fixed − Savings − Essentials − Subscriptions + Rollover  =  '\n        + this.fmt(m.income) + ' − ' + this.fmt(totals.fixedTotal) + ' − ' + this.fmt(totals.savingsTotal) + ' − '\n        + this.fmt(totals.essentialsTotal) + ' − ' + this.fmt(totals.subsTotal) + ' + ' + this.fmt(totals.rolloverIn)\n        + '  =  ' + this.fmt(totals.trueDiscretionary),\n      tipFreeText: 'True Discretionary − Recurring Bucket Allocations − One-time Top-ups − Manual Spending  =  '\n        + this.fmt(totals.trueDiscretionary) + ' − ' + this.fmt(totals.bucketAllocTotal) + ' − ' + this.fmt(totals.bucketTopUps)\n        + ' − ' + this.fmt(totals.manualSpent) + '  =  ' + this.fmt(totals.leftForFreeSpending),\n      fmtEfContribution: this.fmt(efFund.contribution),\n      efColumns: efFund.columns,\n      efHasOffChart: !!efFund.offChartLabel,\n      efOffChartLabel: efFund.offChartLabel,\n      hysaColumns: hysaFund.columns,\n      hysaHasOffChart: !!hysaFund.offChartLabel,\n      hysaOffChartLabel: hysaFund.offChartLabel,\n      hysaPaused: hysaFund.paused,\n      fmtHysaStatus: hysaFund.paused ? 'paused' : ('contributing ' + this.fmt(hysaFund.contribution) + '/mo'),\n      cashFlowChartRef: this.cashFlowChartRef,\n      discretionaryChartRef: this.discretionaryChartRef,\n      cashFlowLegend: cashFlowLegend,\n      discretionaryLegend: discretionaryLegend,\n      pacerWeeksRemaining: pacer.weeksRemaining.toFixed(1),\n      fmtPacerRemaining: this.fmt(pacer.remaining),\n      fmtPacerAllowance: this.fmt(pacer.weeklyAllowance),\n      pacerColor: pacer.overBudget ? '#C1543A' : '#3A2E26',\n      pacerPct: pacer.pct,\n      pacerBarColor: pacer.overBudget ? '#C1543A' : '#4F8F63',\n      pacerHasMessage: !!pacer.message,\n      pacerMessage: pacer.message || '',\n      pacerMessageIcon: pacer.messageType === 'warning' ? '⚠️' : '📝',\n      pacerMessageBg: pacer.messageType === 'warning' ? '#FBEAE4' : '#FCEADD',\n      pacerMessageColor: pacer.messageType === 'warning' ? '#C1543A' : '#8A4B2A',\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
